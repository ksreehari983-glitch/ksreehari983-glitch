<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/>
      <stop offset="0.55" stop-color="#07152B"/>
      <stop offset="1" stop-color="#001F4D"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9FF"/>
      <stop offset="1" stop-color="#007BFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .p1,.p2,.p3 { opacity:0; transform-box:fill-box; transform-origin:center; }
      .p1 { animation: show1 9s infinite; }
      .p2 { animation: show2 9s infinite; }
      .p3 { animation: show3 9s infinite; }
      @keyframes show1 {
        0%, 27% { opacity:1; transform:translateY(0) scale(1); }
        32%,100% { opacity:0; transform:translateY(12px) scale(.98); }
      }
      @keyframes show2 {
        0%, 30% { opacity:0; transform:translateY(12px) scale(.98); }
        35%, 60% { opacity:1; transform:translateY(0) scale(1); }
        65%,100% { opacity:0; transform:translateY(12px) scale(.98); }
      }
      @keyframes show3 {
        0%, 63% { opacity:0; transform:translateY(12px) scale(.98); }
        68%, 93% { opacity:1; transform:translateY(0) scale(1); }
        98%,100% { opacity:0; transform:translateY(12px) scale(.98); }
      }
      .pulse { animation:pulse 2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity:.45; } }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="180" fill="#007BFF" opacity=".12" filter="url(#glow)"/>
  <circle cx="980" cy="570" r="230" fill="#00C2FF" opacity=".08" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="145" fill="#7DD3FC" font-size="20" font-weight="700" letter-spacing="5">HELLO, I'M</text>
    <text x="65" y="220" fill="white" font-size="66" font-weight="800">SREEHARI K</text>
    <rect x="68" y="245" width="210" height="5" rx="3" fill="url(#blue)"/>
    <text x="70" y="300" fill="#D9E8FF" font-size="28" font-weight="600">DATA ANALYTICS STUDENT</text>
    <text x="70" y="345" fill="#8FA9C8" font-size="18">Diploma in Computer Engineering</text>

    <g font-size="16" font-weight="700">
      <rect x="70" y="390" width="88" height="34" rx="17" fill="#0D2747" stroke="#2196FF"/>
      <text x="114" y="413" text-anchor="middle" fill="#6EC8FF">PYTHON</text>
      <rect x="168" y="390" width="76" height="34" rx="17" fill="#0D2747" stroke="#2196FF"/>
      <text x="206" y="413" text-anchor="middle" fill="#6EC8FF">EXCEL</text>
      <rect x="254" y="390" width="82" height="34" rx="17" fill="#0D2747" stroke="#2196FF"/>
      <text x="295" y="413" text-anchor="middle" fill="#6EC8FF">MYSQL</text>
      <rect x="346" y="390" width="92" height="34" rx="17" fill="#0D2747" stroke="#2196FF"/>
      <text x="392" y="413" text-anchor="middle" fill="#6EC8FF">ANDROID</text>
    </g>

    <text x="70" y="485" fill="#6EC8FF" font-size="17" class="pulse">● AVAILABLE TO LEARN • BUILD • CREATE</text>
  </g>

  <g class="p1"><image href="assets/person1.png" x="720" y="20" width="330" height="600" preserveAspectRatio="xMidYMax meet"/></g>
  <g class="p2"><image href="assets/person2.png" x="720" y="20" width="330" height="600" preserveAspectRatio="xMidYMax meet"/></g>
  <g class="p3"><image href="assets/person3.png" x="720" y="20" width="330" height="600" preserveAspectRatio="xMidYMax meet"/></g>

  <path d="M690 90V530" stroke="#168CFF" stroke-width="1" opacity=".25"/>
  <circle cx="690" cy="310" r="4" fill="#4CC9FF" class="pulse"/>
</svg>
